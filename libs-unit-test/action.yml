name: Library unit test
description: Build and test internal Library
inputs:
  working-directory:
    required: true
    description: Which library to build
  check_name:
    required: true
    description: Name which is displayed in test results
  use-cache:
    required: false
    default: 'True'
    description: Enable or disable Conan caching

runs:
    using: 'composite'
    steps:
    - name: Cache Conan packages
      if: inputs.use-cache == 'True'
      uses: actions/cache@v6
      with:
        path: ~/.conan2/p
        key: ${{ runner.os }}-conan2-${{ inputs.working-directory }}-${{ hashFiles(format('{0}/conanfile.txt', inputs.working-directory), format('{0}/conanfile.py', inputs.working-directory)) }}
        restore-keys: |
          ${{ runner.os }}-conan2-${{ inputs.working-directory }}-

    - name: Conan install
      run: conan install . --build=missing -c tools.cmake.cmaketoolchain:generator="Unix Makefiles" --format=json > graph.json
      working-directory: ${{inputs.working-directory}}
      shell: bash

    - name: Conan upload transient binaries
      # Extract refs where binary is "build" AND the name does not contain "-snapshot"
      # Upload only the filtered stable artifacts
      run: |
        STABLE_BUILT=$(jq -r '.graph.nodes[] | select(.binary == "Build" and (.ref | contains("-snapshot") | not) and .ref != "conanfile") | .ref' graph.json)
        echo "=== Selected refs for Upload ==="
        echo "$STABLE_BUILT"
        for ref in $STABLE_BUILT; do
          if [ -n "$ref" ] && [ "$ref" != "null" ]; then
            conan upload "$ref" -r neboskreb-conan --confirm
          fi
        done
      working-directory: ${{inputs.working-directory}}
      shell: bash

    - name: CMake configure
      run: |
        # According to the Preset, binaryDir is explicitly build/Release
        # Create the CMake File API query inside the configured binaryDir BEFORE running configure
        mkdir -p build/Release/.cmake/api/v1/query
        printf '{"requests":[{"kind":"codemodel","version":2}]}' > build/Release/.cmake/api/v1/query/codemodel-v2
        # We need to run from the root where CMakeUserPresets.json is, but conan-release forces the build folder to build/Release
        cmake --preset conan-release
      working-directory: ${{inputs.working-directory}}
      shell: bash

    - name: CMake build
      run: cmake --build build/Release
      working-directory: ${{inputs.working-directory}}
      shell: bash

    - name: Locate executable from CMake target
      run: |
        set -euo pipefail
        
        reply_dir="build/Release/.cmake/api/v1/reply"
        index_file="$(find "$reply_dir" -name 'index-*.json' -print -quit)"
        
        if [ -z "$index_file" ]; then
          echo "FATAL: CMake File API index was not generated" >&2
          exit 1
        fi
        
        codemodel_file="$reply_dir/$(jq -r '.reply["codemodel-v2"].jsonFile' "$index_file")"
        
        # Search for the first EXECUTABLE target in the codemodel
        executable_rel_path="$(
          jq -r '.configurations[0].targets[].jsonFile' "$codemodel_file" | while read -r target_file; do
            target_json="$reply_dir/$target_file"
            if [ "$(jq -r '.type' "$target_json")" = "EXECUTABLE" ]; then
              jq -r '.artifacts[0].path' "$target_json"
              break
            fi
          done
        )"
        
        if [ -z "$executable_rel_path" ]; then
          echo "FATAL: No executable target found in CMake codemodel" >&2
          exit 1
        fi
        
        # The artifact path inside the target JSON is relative to the binaryDir (build/Release)
        EXECUTABLE_PATH="build/Release/$executable_rel_path"
        
        echo "INFO: Detected executable at: $EXECUTABLE_PATH" >&2
        echo "executable=$EXECUTABLE_PATH" >> "$GITHUB_ENV"
      working-directory: ${{inputs.working-directory}}
      shell: bash

    - name: Run tests
      run: ${{env.executable}} --gtest_output="xml:./build/Release/gtest-report.xml"
      working-directory: ${{inputs.working-directory}}
      shell: bash

    - name: Publish Test Report
      # Now collect the results and report the failures, if present
      uses: EnricoMi/publish-unit-test-result-action@v2
      if: always() # always run even if the previous step fails
      with:
        files: '**/gtest-report.xml'
        check_name: ${{inputs.check_name}}
